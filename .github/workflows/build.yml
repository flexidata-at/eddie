name: Build and test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, integration tests, and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@5d7b2146334bacf88728daaa70414a99f5164e0f
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@bfd569614358980afc8f89c2730eee75bb97efdf
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build and test
        run: ./gradlew --no-daemon --max-workers=2 build integrationTest codeCoverageReport --stacktrace
      - name: Analyze main in FlexiData SonarQube
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          : "${SONAR_TOKEN:?Configure the SONAR_TOKEN repository secret}"
          : "${SONAR_HOST_URL:?Configure the SONAR_HOST_URL repository variable}"
          : "${SONAR_PROJECT_KEY:?Configure the SONAR_PROJECT_KEY repository variable}"
          ./gradlew --no-daemon --max-workers=2 sonar --stacktrace \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.scm.revision="$GITHUB_SHA" \
            -Dsonar.qualitygate.wait=true
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: build-reports-${{ github.run_id }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
