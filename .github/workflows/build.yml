name: Build and test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

# Upstream AT EDA fixtures assert dates in the Vienna timezone.
env:
  TZ: Europe/Vienna

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main-quality-diagnostics:
    name: Report current main Sonar diagnostics
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Read sanitized quality conditions and new-code issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ['SONAR_TOKEN']
          if not token:
              raise SystemExit('SONAR_TOKEN is not configured')

          def read(path, parameters):
              url = 'https://sonar.flexidata.at/api/' + path + '?' + urllib.parse.urlencode(parameters)
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit('Sonar diagnostics request failed with HTTP ' + str(error.code)) from None

          project = 'flexidata-at_eddie'
          analyses = read('project_analyses/search', {'project': project, 'ps': 1})
          latest = next(iter(analyses.get('analyses', [])), {})
          print(json.dumps({'mainAnalysis': {key: latest.get(key) for key in ('key', 'date', 'revision')}}))
          gate = read('qualitygates/project_status', {'projectKey': project})['projectStatus']
          print(json.dumps({'qualityGate': gate.get('status'), 'conditions': [
              {key: condition.get(key) for key in ('metricKey', 'status', 'actualValue', 'errorThreshold')}
              for condition in gate.get('conditions', [])
          ]}))
          issues = read('issues/search', {'componentKeys': project, 'inNewCodePeriod': 'true',
                                          'resolved': 'false', 'ps': 500})
          print(json.dumps({'newIssueTotal': issues.get('total'), 'returned': len(issues.get('issues', []))}))
          for issue in issues.get('issues', []):
              print(json.dumps({'issue': {key: issue.get(key) for key in
                    ('rule', 'component', 'line', 'message', 'severity')}}))
          PY

  build:
    name: Build, integration tests, and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@5d7b2146334bacf88728daaa70414a99f5164e0f
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@bfd569614358980afc8f89c2730eee75bb97efdf
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build and test
        run: ./gradlew --no-daemon --max-workers=2 --continue build integrationTest codeCoverageReport --stacktrace
      - name: Analyze main in FlexiData SonarQube
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          : "${SONAR_TOKEN:?Configure the SONAR_TOKEN repository secret}"
          : "${SONAR_HOST_URL:?Configure the SONAR_HOST_URL repository variable}"
          : "${SONAR_PROJECT_KEY:?Configure the SONAR_PROJECT_KEY repository variable}"
          ./gradlew --no-daemon --max-workers=2 sonar --stacktrace \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.scm.revision="$GITHUB_SHA" \
            -Dsonar.qualitygate.wait=true
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: build-reports-${{ github.run_id }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
