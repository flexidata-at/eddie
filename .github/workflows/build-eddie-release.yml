name: Build EDDIE release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag, for example v1.2.3
        required: true
        type: string
      latest:
        description: Also tag the package as latest
        required: false
        default: true
        type: boolean

concurrency:
  group: build-eddie-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: flexidata-at
  IMAGE_NAME: eddie

jobs:
  validate:
    name: Validate EDDIE release
    runs-on: [ Linux ]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.validate.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        id: validate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.2.3, optionally with a semver suffix."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "### EDDIE release"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | $VERSION |"
            echo "| Image | ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:$VERSION |"
            echo "| Latest | ${{ inputs.latest }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-package:
    name: Publish EDDIE package
    runs-on: [ Linux ]
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6

      - name: Build and push EDDIE container
        uses: ./.github/actions/build-containers
        with:
          version: ${{ needs.validate.outputs.version }}
          registry: ${{ env.REGISTRY }}
          namespace: ${{ env.REGISTRY_NAMESPACE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          latest: ${{ inputs.latest }}
          eddie: 'true'
          aiida: 'false'

  release:
    name: Create EDDIE GitHub release
    runs-on: [ Linux ]
    timeout-minutes: 10
    needs: [validate, publish-package]
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          fetch-depth: 0

      - name: Create EDDIE GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: eddie-${{ needs.validate.outputs.version }}
          name: EDDIE ${{ needs.validate.outputs.version }}
          body: |
            EDDIE container image:
            `${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}`
          make_latest: false
