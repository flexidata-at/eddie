# SPDX-License-Identifier: Apache-2.0
name: Publish containers
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Publish a commit snapshot or a versioned release
        type: choice
        options: [snapshot, release]
        default: snapshot
        required: true
      version:
        description: Release version, for example v1.2.3 or v1.2.3-rc.1; unused for snapshots
        type: string
        required: false
      latest:
        description: Also update latest for a stable release
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: publish-containers
  cancel-in-progress: false

jobs:
  validate:
    name: Validate publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate branch and version
        id: validate
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'flexidata-at/eddie' || "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Publish from flexidata-at/eddie main only.' >&2
            exit 1
          fi
          if [[ "$CHANNEL" == 'snapshot' ]]; then
            if [[ -n "$VERSION" || "$LATEST" == 'true' ]]; then
              echo 'Snapshots require an empty version and latest=false.' >&2
              exit 1
            fi
            VERSION="snapshot-$GITHUB_SHA"
            TAG=''
          elif [[ "$CHANNEL" == 'release' ]]; then
            python3 - <<'PY'
          import os, re
          version = os.environ['VERSION']
          number = r'(0|[1-9][0-9]*)'
          if not re.fullmatch(rf'v{number}\.{number}\.{number}(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?', version):
              raise SystemExit('Use vMAJOR.MINOR.PATCH, optionally with a prerelease suffix; build metadata is not a container tag.')
          if '-' in version:
              for identifier in version.split('-', 1)[1].split('.'):
                  if identifier.isdigit() and len(identifier) > 1 and identifier.startswith('0'):
                      raise SystemExit('Numeric prerelease identifiers cannot have leading zeros.')
              if os.environ['LATEST'] == 'true':
                  raise SystemExit('Prereleases cannot update latest.')
          PY
            TAG="flexidata-$VERSION"
            existing_tags=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/eddie-$VERSION" "refs/tags/aiida-$VERSION")
            if [[ -n "$existing_tags" ]]; then
              echo "Release tag $TAG already exists; choose a new version." >&2
              exit 1
            fi
          else
            echo 'Unknown publication channel.' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Container tag: $VERSION"
            echo "Update latest: $LATEST"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify the publication commit
    needs: validate
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish tested containers
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@5d7b2146334bacf88728daaa70414a99f5164e0f
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@bfd569614358980afc8f89c2730eee75bb97efdf
      - name: Build and publish containers
        uses: ./.github/actions/build-containers
        with:
          version: ${{ needs.validate.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          latest: ${{ inputs.latest }}

  release:
    name: Record the published release
    if: inputs.channel == 'release'
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create a GitHub release at the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FlexiData EDDIE $VERSION" --generate-notes "--latest=$LATEST")
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          notes="Source commit: $GITHUB_SHA

          Containers:
          ghcr.io/flexidata-at/valandex-eddie:$VERSION (linux/amd64)
          ghcr.io/flexidata-at/valandex-aiida:$VERSION (linux/amd64, linux/arm64)
          ghcr.io/flexidata-at/eddie-example-app:$VERSION (linux/amd64)"
          gh release create "$TAG" "${args[@]}" --notes "$notes"
