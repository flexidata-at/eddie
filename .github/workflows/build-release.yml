name: Release EDDIE and AIIDA packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag, for example v1.2.3
        required: true
        type: string
      eddie:
        description: Release the EDDIE package
        required: false
        default: true
        type: boolean
      aiida:
        description: Release the AIIDA package
        required: false
        default: true
        type: boolean
      latest:
        description: Also tag selected packages as latest
        required: false
        default: true
        type: boolean

concurrency:
  group: release-eddie-aiida-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: flexidata-at

jobs:
  validate:
    name: Validate release selection
    runs-on: [ Linux ]
    timeout-minutes: 5
    outputs:
      eddie: ${{ steps.selection.outputs.eddie }}
      aiida: ${{ steps.selection.outputs.aiida }}
      version: ${{ steps.selection.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        id: selection
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_EDDIE: ${{ inputs.eddie }}
          RELEASE_AIIDA: ${{ inputs.aiida }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.2.3, optionally with a semver suffix."
            exit 1
          fi

          if [[ "$RELEASE_EDDIE" != "true" && "$RELEASE_AIIDA" != "true" ]]; then
            echo "Select at least one package to release."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "eddie=$RELEASE_EDDIE"
            echo "aiida=$RELEASE_AIIDA"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release selection"
            echo ""
            echo "| Package | Release | Image |"
            echo "| --- | --- | --- |"
            echo "| EDDIE | $RELEASE_EDDIE | ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/eddie:$VERSION |"
            echo "| AIIDA | $RELEASE_AIIDA | ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/aiida:$VERSION |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-packages:
    name: Publish selected GHCR packages
    runs-on: [ Linux ]
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6

      - name: Print release target
        run: |
          set -euo pipefail
          echo Version: ${{ needs.validate.outputs.version }}
          echo Registry namespace: ${{ env.REGISTRY_NAMESPACE }}

      - name: Build and push selected containers
        uses: ./.github/actions/build-containers
        with:
          version: ${{ needs.validate.outputs.version }}
          registry: ${{ env.REGISTRY }}
          namespace: ${{ env.REGISTRY_NAMESPACE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          latest: ${{ inputs.latest }}
          eddie: ${{ needs.validate.outputs.eddie }}
          aiida: ${{ needs.validate.outputs.aiida }}

  release-eddie:
    name: Create EDDIE release
    runs-on: [ Linux ]
    timeout-minutes: 10
    needs: [validate, publish-packages]
    if: ${{ needs.validate.outputs.eddie == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          fetch-depth: 0

      - name: Create EDDIE GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: eddie-${{ needs.validate.outputs.version }}
          name: EDDIE ${{ needs.validate.outputs.version }}
          body: |
            EDDIE container image:
            `${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/eddie:${{ needs.validate.outputs.version }}`
          make_latest: false

  release-aiida:
    name: Create AIIDA release
    runs-on: [ Linux ]
    timeout-minutes: 10
    needs: [validate, publish-packages]
    if: ${{ needs.validate.outputs.aiida == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          fetch-depth: 0

      - name: Create AIIDA GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: aiida-${{ needs.validate.outputs.version }}
          name: AIIDA ${{ needs.validate.outputs.version }}
          body: |
            AIIDA container image:
            `${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/aiida:${{ needs.validate.outputs.version }}`
          make_latest: false
