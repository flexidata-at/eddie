name: Build containers
description: Publish EDDIE, the example application, and AIIDA from the caller's tested checkout
inputs:
  version:
    description: Immutable container tag
    required: true
  token:
    description: GitHub Container Registry token
    required: true
  latest:
    description: Also promote the published version to latest
    default: 'false'

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.token }}
      run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
    - name: Reject existing image tags
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        for image in valandex-eddie valandex-aiida eddie-example-app; do
          if tags=$(gh api "orgs/flexidata-at/packages/container/$image/versions?per_page=100" --paginate --jq '.[].metadata.container.tags[]' 2>&1); then
            if grep -Fxq "$VERSION" <<< "$tags"; then
              echo "Image ghcr.io/flexidata-at/$image:$VERSION already exists; choose a new version." >&2
              exit 1
            fi
          elif ! grep -q '(HTTP 404)' <<< "$tags"; then
            echo "Cannot verify image tags for $image: $tags" >&2
            exit 1
          fi
        done
    - name: Build application distributions
      shell: bash
      run: ./gradlew --no-daemon --max-workers=2 :core:installDist :examples:example-app:installDist --stacktrace
    - name: Build EDDIE and example images
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          -f core/src/main/docker/Dockerfile -t "ghcr.io/flexidata-at/valandex-eddie:$VERSION" core
        docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          -f examples/example-app/src/main/docker/Dockerfile -t "ghcr.io/flexidata-at/eddie-example-app:$VERSION" examples/example-app
    - name: Build and publish AIIDA once with Jib
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REGISTRY_TOKEN: ${{ inputs.token }}
      run: |
        ./gradlew --no-daemon --max-workers=2 :aiida:jib --stacktrace \
          --image="ghcr.io/flexidata-at/valandex-aiida:$VERSION" \
          -Djib.to.auth.username="$GITHUB_ACTOR" \
          -Djib.to.auth.password="$REGISTRY_TOKEN" \
          -Djib.container.labels="org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY,org.opencontainers.image.revision=$GITHUB_SHA"
    - name: Publish EDDIE and example images
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        docker push "ghcr.io/flexidata-at/valandex-eddie:$VERSION"
        docker push "ghcr.io/flexidata-at/eddie-example-app:$VERSION"
    - name: Promote all published images to latest
      if: inputs.latest == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        for image in valandex-eddie valandex-aiida eddie-example-app; do
          docker buildx imagetools create --tag "ghcr.io/flexidata-at/$image:latest" "ghcr.io/flexidata-at/$image:$VERSION"
        done
    - name: Record published image digests
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        for image in valandex-eddie valandex-aiida eddie-example-app; do
          target="ghcr.io/flexidata-at/$image:$VERSION"
          echo "### $target" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$target" >> "$GITHUB_STEP_SUMMARY"
        done
    - name: Log out of GHCR
      if: always()
      shell: bash
      run: docker logout ghcr.io
