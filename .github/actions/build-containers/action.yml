name: Build EDDIE and AIIDA containers
description: Build and push EDDIE and AIIDA docker containers
inputs:
  version:
    description: 'version tag'
    required: true
  registry:
    description: 'Container registry'
    required: false
    default: 'ghcr.io'
  namespace:
    description: 'Container registry namespace'
    required: false
    default: 'flexidata-at'
  token:
    description: 'The github registry token'
    required: true
  latest:
    description: 'Whether this release should also be tagged as latest'
    required: false
    default: 'false'
  eddie:
    description: 'Whether to build and push the EDDIE image'
    required: false
    default: 'true'
  aiida:
    description: 'Whether to build and push the AIIDA image'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
    - name: Set up JDK
      if: inputs.eddie == 'true' || inputs.aiida == 'true'
      uses: actions/setup-java@5d7b2146334bacf88728daaa70414a99f5164e0f
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Gradle build
      if: inputs.eddie == 'true'
      shell: bash
      run: |
        set -euo pipefail
        ./gradlew installDist
    - name: "Docker build image: EDDIE"
      if: inputs.eddie == 'true'
      shell: bash
      run: |
        set -euo pipefail
        docker build -f ./core/src/main/docker/Dockerfile -t eddie ./core
    - name: Print release information
      shell: bash
      run: |
        set -euo pipefail
        echo registry: ${{ inputs.registry }}
        echo namespace: ${{ inputs.namespace }}
        echo github.ref: ${{ github.ref }}
        echo GITHUB_RUN_ID: ${GITHUB_RUN_ID}
    # Usage of docker is done through direct commands instead of using predefined actions for these reasons:
    # - Usage of the docker command line is well documented and already understood by all developers that
    #   used docker before. Usage of a docker-related action requires additional knowledge that is seldomly present.
    # - Security tokens are not passed through an action to give less surface to supply chain attacks that might be
    #   used for stealing docker related secrets. That supply chain attack may occur in the used GitHub action or any
    #   library that is used by that action explicitly or implicitly. Especially in the Node.js/npm ecosystem that
    #   must be used by all GitHub actions, supply chain attacks became common in recent times.
    - name: ghcr.io login
      if: inputs.eddie == 'true'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        echo "$TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
    - name: "Docker push image: EDDIE"
      if: inputs.eddie == 'true'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        NAMESPACE: ${{ inputs.namespace }}
        VERSION: ${{ inputs.version }}
        LATEST: ${{ inputs.latest }}
      # language=bash
      run: |
        set -euo pipefail
        IMAGE_NAME=eddie
        IMAGE_ID=$REGISTRY/$NAMESPACE/$IMAGE_NAME
        echo IMAGE_NAME: $IMAGE_NAME
        echo IMAGE_ID: $IMAGE_ID
        echo VERSION: $VERSION
        docker tag "$IMAGE_NAME" "$IMAGE_ID:$VERSION"
        if [[ "$LATEST" == 'true' ]]; then
          docker tag "$IMAGE_NAME" "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:latest"
        fi 
        docker push "$IMAGE_ID:$VERSION"
    - name: Post ghcr.io login
      if: inputs.eddie == 'true'
      shell: bash
      run: |
        set -euo pipefail
        rm -f "$HOME/.docker/config.json"

    - name: Set up JDK 21
      if: inputs.aiida == 'true'
      uses: actions/setup-java@5d7b2146334bacf88728daaa70414a99f5164e0f
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build and publish AIIDA image
      if: inputs.aiida == 'true'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        NAMESPACE: ${{ inputs.namespace }}
        VERSION: ${{ inputs.version }}
        TOKEN: ${{ inputs.token }}
        LATEST: ${{ inputs.latest }}
      # language=bash
      run: |
        set -euo pipefail
        IMAGE_NAME=aiida
        IMAGE_ID=$REGISTRY/$NAMESPACE/$IMAGE_NAME
        echo $IMAGE_ID
        ./gradlew --no-daemon --stacktrace jib \
          --image "$IMAGE_ID:$VERSION" \
          -Djib.to.auth.username="${{ github.actor }}" \
          -Djib.to.auth.password="$TOKEN"
        # Second build should not make a difference since JIB caches quiet aggressively: https://github.com/GoogleContainerTools/jib/issues/802#issuecomment-417124198
        if [[ "$LATEST" == 'true' ]]; then
          ./gradlew --no-daemon --stacktrace jib \
            --image "$IMAGE_ID:latest" \
            -Djib.to.auth.username="${{ github.actor }}" \
            -Djib.to.auth.password="$TOKEN"
        fi 
